<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务</title>
    <style id="theme-vars">
/* PayMe 专注 — Design Tokens
   Primary hue: warm gold (earnings / coin theme)
   Focus screen: deep dark immersive background
   Task list: clean light iOS surface
*/

:root {
  /* === Brand Primary (Gold) === */
  --brand-gold: #D4A017;
  --brand-gold-light: #E8C25A;
  --brand-gold-dark: #B8860B;
  --brand-gold-soft: #F5E6C8;

  /* === Light Mode — Task List === */
  --brand-background: #F7F6F2;
  --brand-foreground: #1A1A1F;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #1A1A1F;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1A1A1F;
  --brand-primary: #D4A017;
  --brand-primary-foreground: #1A1A1F;
  --brand-muted: #F0EDE5;
  --brand-muted-foreground: #8A8A8E;
  --brand-border: #E5E2DA;
  --brand-input: #F0EDE5;
  --brand-ring: #D4A017;

  /* === Dark Mode — Focus Screen === */
  --brand-dark-bg: #0B0B0F;
  --brand-dark-surface: #14141A;
  --brand-dark-surface-2: #1E1E26;
  --brand-dark-ink: #FFFFFF;
  --brand-dark-ink-2: rgba(255,255,255,0.65);
  --brand-dark-ink-3: rgba(255,255,255,0.40);
  --brand-dark-border: rgba(255,255,255,0.08);
  --brand-dark-gold: #F0C75E;
  --brand-dark-gold-soft: rgba(240,199,94,0.12);

  /* === State Colors === */
  --state-success: #34A853;
  --state-warning: #F5A623;
  --state-error: #EA4335;
  --state-info: #4A90D9;

  /* === Radius Scale === */
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-radius-xl: 16px;
  --brand-radius-pill: 999px;

  /* === Typography === */
  --brand-font-sans: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", system-ui, sans-serif;
  --brand-font-mono: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;

  /* === Spacing === */
  --brand-space-1: 4px;
  --brand-space-2: 8px;
  --brand-space-3: 12px;
  --brand-space-4: 16px;
  --brand-space-5: 24px;
  --brand-space-6: 32px;
  --brand-space-7: 48px;

  /* === Shadows === */
  --brand-shadow-1: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
  --brand-shadow-2: 0 8px 24px -8px rgba(15,23,42,0.05);
  --brand-shadow-3: 0 24px 60px -20px rgba(15,23,42,0.05);
  --brand-shadow-gold: 0 4px 20px -4px rgba(212,160,23,0.05);
  --brand-shadow-modal: 0 8px 24px -8px rgba(15,23,42,0.12);
  --brand-shadow-overlay: 0 24px 60px -20px rgba(15,23,42,0.25);
  --brand-shadow-gold-glow: 0 4px 20px -4px rgba(212,160,23,0.30);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
    --radius-xl: var(--brand-radius-xl);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="app-root">
      <!-- Coin icon symbol definition (reusable inline SVG) -->
      <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
        <defs>
          <symbol id="icon-coin" viewBox="0 0 16 16">
            <circle cx="8" cy="8" r="7" fill="var(--brand-gold)"/>
            <circle cx="8" cy="8" r="5.6" fill="none" stroke="var(--brand-gold-dark)" stroke-width="0.6" opacity="0.4"/>
            <text x="8" y="8" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="700" fill="var(--brand-foreground)" font-family="-apple-system, 'PingFang SC', sans-serif">¥</text>
          </symbol>
          <symbol id="icon-banknote" viewBox="0 0 24 16">
            <rect x="0.5" y="0.5" width="23" height="15" rx="2.5" fill="#4CAF50" fill-opacity="0.15" stroke="#2E7D32" stroke-width="0.8"/>
            <rect x="2.5" y="2.5" width="19" height="11" rx="1.5" fill="none" stroke="#2E7D32" stroke-width="0.4" stroke-dasharray="1.5 1" stroke-opacity="0.4"/>
            <circle cx="12" cy="8" r="3.5" fill="none" stroke="#2E7D32" stroke-width="0.6" stroke-opacity="0.5"/>
            <text x="12" y="8" text-anchor="middle" dominant-baseline="central" font-size="5" font-weight="700" fill="#2E7D32" font-family="-apple-system, 'PingFang SC', sans-serif">¥</text>
          </symbol>
        </defs>
      </svg>

      <!-- iOS Status Bar (decorative) -->
      <header class="status-bar" role="presentation" aria-hidden="true">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="0.75"/>
            <rect x="5" y="5.5" width="3" height="6.5" rx="0.75"/>
            <rect x="10" y="3" width="3" height="9" rx="0.75"/>
            <rect x="15" y="0.5" width="3" height="11.5" rx="0.75"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
            <path d="M8 2.4C5.5 2.4 3.2 3.3 1.5 4.9L0.1 3.4C2.2 1.3 5 0 8 0s5.8 1.3 7.9 3.4l-1.4 1.5C12.8 3.3 10.5 2.4 8 2.4z"/>
            <path d="M8 5.9c-1.6 0-3.1 0.6-4.2 1.7L2.3 6c1.6-1.6 3.6-2.5 5.7-2.5s4.1 0.9 5.7 2.5l-1.5 1.6C11.1 6.5 9.6 5.9 8 5.9z"/>
            <circle cx="8" cy="9.8" r="2"/>
          </svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true">
            <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="currentColor" stroke-opacity="0.35"/>
            <rect x="2" y="2" width="19" height="8" rx="1.8" fill="currentColor"/>
            <rect x="23.5" y="3.5" width="1.8" height="5" rx="0.9" fill="currentColor" fill-opacity="0.35"/>
          </svg>
        </div>
      </header>

      <!-- Scrollable content -->
      <div class="app-content">
        <!-- Header -->
        <section class="page-header">
          <h1 class="page-title">任务</h1>
          <div class="earnings-row">
            <span class="earnings-label">今日已赚取</span>
            <span class="earnings-amount">
              <svg width="14" height="14" aria-hidden="true"><use href="#icon-coin"></use></svg>
              <span>¥12.50</span>
            </span>
          </div>
        </section>

        <!-- Summary Card -->
        <div class="summary-card">
          <div class="summary-head">
            <i data-lucide="flame" class="summary-icon w-4 h-4 shrink-0"></i>
            <span>专注 3 次 · 累计 75 分钟</span>
          </div>
          <div class="summary-progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100">
            <span></span>
          </div>
          <div class="summary-foot">
            <span>距今日目标 120 分钟</span>
            <span>62%</span>
          </div>
        </div>

        <!-- Skin Selector -->
        <div class="skin-selector" id="skin-selector">
          <div class="skin-label">专注皮肤</div>
          <div class="skin-options">
            <button type="button" class="skin-option" data-skin="coin" data-active="true">
              <span class="skin-icon-wrap">
                <svg viewBox="0 0 16 16" width="22" height="22"><use href="#icon-coin"/></svg>
              </span>
              <span class="skin-name">金币</span>
            </button>
            <button type="button" class="skin-option" data-skin="banknote">
              <span class="skin-icon-wrap">
                <svg viewBox="0 0 24 16" width="26" height="18"><use href="#icon-banknote"/></svg>
              </span>
              <span class="skin-name">钞票</span>
            </button>
          </div>
        </div>

        <!-- Task List -->
        <section id="section-tasks" class="task-section">
          <div class="section-header">
            <h2 class="section-label">今日任务</h2>
            <button type="button" class="add-task-btn" id="add-task-btn" aria-label="新建任务">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
          </div>
          <div class="task-list" id="task-list">
            <button type="button" data-dom-id="task-item-relax" class="task-card">
              <div class="task-info">
                <span class="task-name">放松工作</span>
                <span class="task-meta">1小时 · ¥30/小时</span>
              </div>
              <div class="task-right">
                <div class="task-reward">
                  <svg width="16" height="16" aria-hidden="true"><use href="#icon-coin"></use></svg>
                  <span class="reward-amount">¥30.00</span>
                </div>
                <span class="edit-btn" data-edit="task-item-relax" role="button" tabindex="0" aria-label="编辑任务">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </span>
              </div>
            </button>

            <button type="button" data-dom-id="task-item-sport" class="task-card">
              <div class="task-info">
                <span class="task-name">运动</span>
                <span class="task-meta">1小时 · ¥20/小时</span>
              </div>
              <div class="task-right">
                <div class="task-reward">
                  <svg width="16" height="16" aria-hidden="true"><use href="#icon-coin"></use></svg>
                  <span class="reward-amount">¥20.00</span>
                </div>
                <span class="edit-btn" data-edit="task-item-sport" role="button" tabindex="0" aria-label="编辑任务">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </span>
              </div>
            </button>

            <button type="button" data-dom-id="task-item-cleanup" class="task-card">
              <div class="task-info">
                <span class="task-name">整理房间</span>
                <span class="task-meta">1小时 · ¥10/小时</span>
              </div>
              <div class="task-right">
                <div class="task-reward">
                  <svg width="16" height="16" aria-hidden="true"><use href="#icon-coin"></use></svg>
                  <span class="reward-amount">¥10.00</span>
                </div>
                <span class="edit-btn" data-edit="task-item-cleanup" role="button" tabindex="0" aria-label="编辑任务">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </span>
              </div>
            </button>
          </div>
        </section>
      </div>

      <!-- Bottom Navigation -->
      <nav data-mobile-nav="global" class="w-full h-16">
        <div class="w-full max-w-md mx-auto grid grid-cols-3 h-full">
          <a data-nav-key="tasks" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-1 px-1 h-full">
            <i data-lucide="check-square" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">任务</span>
          </a>
          <a data-nav-key="history" class="min-w-0 flex flex-col items-center justify-center gap-1 px-1 h-full">
            <i data-lucide="bar-chart-3" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">记录</span>
          </a>
          <a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-1 px-1 h-full">
            <i data-lucide="user" class="w-5 h-5 shrink-0"></i>
            <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span>
          </a>
        </div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
    <script>
      (function () {
        var skinOpts = document.querySelectorAll('.skin-option[data-skin]');
        skinOpts.forEach(function (opt) {
          opt.addEventListener('click', function () {
            skinOpts.forEach(function (o) { o.removeAttribute('data-active'); });
            opt.setAttribute('data-active', 'true');
          });
        });
      })();
    </script>

    <style id="critical-layout">
      /* === Root frame === */
      html, body { max-width: 100%; overflow-x: hidden; }
      body { font-family: var(--brand-font-sans); -webkit-font-smoothing: antialiased; }

      .app-root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        max-width: 100%;
        background: var(--brand-background);
      }

      /* === iOS Status Bar === */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 44px;
        padding: 0 22px;
        flex-shrink: 0;
        color: var(--brand-foreground);
        font-weight: 600;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .status-icons { display: inline-flex; align-items: center; gap: 7px; }

      /* === Content area === */
      .app-content {
        flex: 1 1 auto;
        padding: 6px 16px 28px;
        max-width: 100%;
      }

      /* === Page header === */
      .page-header { padding: 14px 0 18px; }
      .page-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--brand-foreground);
        margin: 0 0 7px;
        line-height: 1.15;
      }
      .earnings-row { display: inline-flex; align-items: center; gap: 6px; }
      .earnings-label { font-size: 13px; color: var(--brand-muted-foreground); }
      .earnings-amount {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--brand-gold);
        font-variant-numeric: tabular-nums;
      }

      /* === Summary card === */
      .summary-card {
        background: linear-gradient(135deg, var(--brand-gold-soft), rgba(245,230,200,0.50));
        border: 1px solid rgba(212,160,23,0.20);
        border-radius: var(--brand-radius-lg);
        padding: 14px 16px 13px;
        margin-bottom: 22px;
        box-shadow: 0 1px 2px rgba(212,160,23,0.06);
      }
      .summary-head {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--brand-foreground);
        font-size: 13.5px;
        font-weight: 500;
      }
      .summary-icon { color: var(--brand-gold); flex-shrink: 0; }
      .summary-progress {
        margin-top: 11px;
        height: 4px;
        background: rgba(212,160,23,0.16);
        border-radius: var(--brand-radius-pill);
        overflow: hidden;
      }
      .summary-progress > span {
        display: block;
        height: 100%;
        width: 62%;
        background: linear-gradient(90deg, var(--brand-gold-light), var(--brand-gold));
        border-radius: var(--brand-radius-pill);
      }
      .summary-foot {
        margin-top: 7px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--brand-muted-foreground);
        font-variant-numeric: tabular-nums;
      }

      /* === Skin Selector === */
      .skin-selector {
        margin-bottom: 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .skin-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--brand-muted-foreground);
        letter-spacing: 0.01em;
      }
      .skin-options {
        display: flex;
        gap: 12px;
      }
      .skin-option {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--brand-card);
        border: 1.5px solid var(--brand-border);
        border-radius: var(--brand-radius-lg);
        padding: 14px 16px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 200ms ease, box-shadow 200ms ease, transform 160ms cubic-bezier(.2,.8,.2,1);
        text-align: left;
      }
      .skin-option:hover {
        transform: translateY(-1px);
        border-color: rgba(212,160,23,0.30);
      }
      .skin-option:active {
        transform: scale(0.98);
        transition: transform 120ms ease;
      }
      .skin-option[data-active="true"] {
        border-color: var(--brand-gold);
        box-shadow: 0 0 0 1px var(--brand-gold), 0 2px 8px rgba(212,160,23,0.12);
      }
      .skin-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .skin-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--brand-card-foreground);
      }
      .skin-option[data-active="true"] .skin-name {
        color: var(--brand-gold);
      }

      /* === Task list === */
      .task-section { margin-top: 2px; }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 11px;
      }
      .section-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--brand-muted-foreground);
        margin: 0;
        letter-spacing: 0.01em;
      }
      .add-task-btn {
        width: 28px; height: 28px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 50%;
        background: var(--brand-gold-soft);
        border: none;
        color: var(--brand-gold);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 160ms cubic-bezier(.2,.8,.2,1), background 160ms ease;
      }
      .add-task-btn:hover { transform: scale(1.08); background: rgba(212,160,23,0.18); }
      .add-task-btn:active { transform: scale(0.94); }
      .task-list { display: flex; flex-direction: column; gap: 12px; }

      /* === Task card === */
      .task-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        background: var(--brand-card);
        border: 1px solid var(--brand-border);
        border-radius: var(--brand-radius-lg);
        padding: 16px;
        box-shadow: var(--brand-shadow-1);
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 160ms cubic-bezier(.2,.8,.2,1),
                    box-shadow 160ms cubic-bezier(.2,.8,.2,1),
                    border-color 160ms ease;
      }
      .task-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--brand-shadow-2);
        border-color: rgba(212,160,23,0.28);
      }
      .task-card:active {
        transform: scale(0.98);
        transition: transform 120ms ease;
      }
      .task-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .task-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--brand-card-foreground);
        line-height: 1.3;
      }
      .task-meta {
        font-size: 13px;
        color: var(--brand-muted-foreground);
      }
      .task-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .task-reward {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .reward-amount {
        font-size: 16px;
        font-weight: 600;
        color: var(--brand-gold);
        font-variant-numeric: tabular-nums;
      }
      .edit-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px; height: 32px;
        border-radius: 50%;
        color: var(--brand-muted-foreground);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 160ms ease, color 160ms ease, transform 120ms ease;
      }
      .edit-btn:hover { background: var(--brand-muted); color: var(--brand-gold); }
      .edit-btn:active { transform: scale(0.90); }

      /* === Bottom navigation === */
      [data-mobile-nav="global"] {
        position: sticky;
        bottom: 0;
        background: rgba(255,255,255,0.92);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        backdrop-filter: saturate(180%) blur(14px);
        border-top: 1px solid var(--brand-border);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        z-index: 20;
      }
      [data-mobile-nav="global"] a {
        transition: color 160ms ease;
        text-decoration: none;
        color: var(--brand-muted-foreground);
      }
      [data-mobile-nav="global"] a[data-active="true"] {
        color: var(--brand-gold);
        font-weight: 600;
      }

      /* === Motion === */
      @keyframes pm-fade-up {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pm-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .summary-card { animation: pm-fade-up 420ms cubic-bezier(.2,.8,.2,1) both; }
      .task-card { animation: pm-fade-in 360ms ease both; }
      .task-list .task-card:nth-child(1) { animation-delay: 50ms; }
      .task-list .task-card:nth-child(2) { animation-delay: 100ms; }
      .task-list .task-card:nth-child(3) { animation-delay: 150ms; }
      .task-list .task-card:nth-child(4) { animation-delay: 200ms; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .task-card:hover, .task-card:active { transform: none; }
      }
    </style>
</body>
</html>
