    <style id="theme-vars">
/* PayMe 专注 — Design Tokens
   Primary hue: warm gold (earnings / coin theme)
   Focus screen: deep dark immersive background
   Task list: clean light iOS surface
*/

:root {
  /* === Brand Primary (Gold) === */
  --brand-gold: #D4A017;
  --brand-gold-light: #E8C25A;
  --brand-gold-dark: #B8860B;
  --brand-gold-soft: #F5E6C8;

  /* === Light Mode — Task List === */
  --brand-background: #F7F6F2;
  --brand-foreground: #1A1A1F;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #1A1A1F;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1A1A1F;
  --brand-primary: #D4A017;
  --brand-primary-foreground: #1A1A1F;
  --brand-muted: #F0EDE5;
  --brand-muted-foreground: #8A8A8E;
  --brand-border: #E5E2DA;
  --brand-input: #F0EDE5;
  --brand-ring: #D4A017;

  /* === Dark Mode — Focus Screen === */
  --brand-dark-bg: #0B0B0F;
  --brand-dark-surface: #14141A;
  --brand-dark-surface-2: #1E1E26;
  --brand-dark-ink: #FFFFFF;
  --brand-dark-ink-2: rgba(255,255,255,0.65);
  --brand-dark-ink-3: rgba(255,255,255,0.40);
  --brand-dark-border: rgba(255,255,255,0.08);
  --brand-dark-gold: #F0C75E;
  --brand-dark-gold-soft: rgba(240,199,94,0.12);

  /* === State Colors === */
  --state-success: #34A853;
  --state-warning: #F5A623;
  --state-error: #EA4335;
  --state-info: #4A90D9;

  /* === Radius Scale === */
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-radius-xl: 16px;
  --brand-radius-pill: 999px;

  /* === Typography === */
  --brand-font-sans: -apple-system, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", system-ui, sans-serif;
  --brand-font-mono: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;

  /* === Spacing === */
  --brand-space-1: 4px;
  --brand-space-2: 8px;
  --brand-space-3: 12px;
  --brand-space-4: 16px;
  --brand-space-5: 24px;
  --brand-space-6: 32px;
  --brand-space-7: 48px;

  /* === Shadows === */
  --brand-shadow-1: 0 1px 3px rgba(15,23,42,0.04), 0 1px 2px rgba(15,23,42,0.03);
  --brand-shadow-2: 0 8px 24px -8px rgba(15,23,42,0.05);
  --brand-shadow-3: 0 24px 60px -20px rgba(15,23,42,0.05);
  --brand-shadow-gold: 0 4px 20px -4px rgba(212,160,23,0.05);
  --brand-shadow-modal: 0 8px 24px -8px rgba(15,23,42,0.12);
  --brand-shadow-overlay: 0 24px 60px -20px rgba(15,23,42,0.25);
  --brand-shadow-gold-glow: 0 4px 20px -4px rgba(212,160,23,0.30);
}

    </style>

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
      /* === Root frame: deep dark immersive canvas === */
      html, body { height: 100%; }
      body {
        background-color: var(--brand-dark-bg);
        background-image: radial-gradient(circle at 50% 20%, rgba(240,199,94,0.04) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--brand-dark-ink);
        font-family: var(--brand-font-sans);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* === Top bar === */
      .top-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 0;
        z-index: 20;
      }
      .close-btn {
        width: 32px; height: 32px;
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: none; cursor: pointer;
        color: rgba(255,255,255,0.40);
        transition: color .2s ease;
      }
      .close-btn:hover { color: rgba(255,255,255,0.65); }
      .close-btn:active { transform: scale(0.94); }

      /* === Skin toggle button === */
      .skin-toggle-btn {
        width: 32px; height: 32px;
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: none; cursor: pointer;
        color: rgba(255,255,255,0.40);
        transition: color .2s ease, transform .15s ease;
        border-radius: 50%;
      }
      .skin-toggle-btn:hover { color: rgba(255,255,255,0.65); }
      .skin-toggle-btn:active { transform: scale(0.92); }
      .skin-toggle-btn svg { display: inline-block; }
        /* === Focus content (wallet centered at screen middle) === */
      .focus-content {
        flex: 1;
        position: relative;
        z-index: 10;
      }

      /* === Task name (above wallet) === */
      .task-name {
        position: absolute;
        top: calc(50vh - 110px); left: 50%;
        transform: translateX(-50%);
        font-size: 17px; font-weight: 600;
        color: var(--brand-dark-ink-2);
        text-align: center;
        z-index: 11;
      }

      /* === Wallet icon (exactly at screen center) === */
      .wallet-icon {
        position: absolute;
        top: 50vh; left: 50vw;
        display: flex; align-items: center; justify-content: center;
        animation: wallet-breathe 2s ease-in-out infinite;
        filter: drop-shadow(0 0 24px rgba(240,199,94,0.30));
      }
      @keyframes wallet-breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.06); }
      }

      /* === Earnings (below wallet) === */
      .earnings {
        position: absolute;
        top: calc(50vh + 85px); left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }
      .earn-amount {
        display: inline-flex; align-items: center;
        justify-content: center; gap: 6px;
      }
      .earn-num {
        font-size: 48px; font-weight: 700;
        color: var(--brand-dark-gold);
        font-variant-numeric: tabular-nums;
        display: inline-block;
        transform-origin: center;
      }
      .earnings-bump { animation: earn-bump 200ms ease-out; }
      @keyframes earn-bump {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      /* === Timer (below earnings) === */
      .timer-display {
        position: absolute;
        top: calc(50vh + 155px); left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }
      .timer-display .time {
        font-size: 28px; font-weight: 300;
        color: var(--brand-dark-ink-3);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em; line-height: 1;
      }

      /* === Coin flow layer === */
      .coin-layer {
        position: absolute; inset: 0;
        pointer-events: none; overflow: hidden;
        z-index: 5;
        perspective: 600px;
      }
      .coin {
        position: absolute;
        top: var(--start-y, -32px);
        left: var(--start-x);
        animation: coin-flow var(--duration) linear var(--delay) infinite;
        will-change: transform, opacity;
        transform-style: preserve-3d;
      }
      .coin svg { display: block; }
      @keyframes coin-flow {
        0% {
          transform: translate3d(0, 0, 0) rotateY(0deg) scale(0.5);
          opacity: 0;
        }
        5% {
          opacity: 0.9;
        }
        15% {
          transform: translate3d(calc((50vw - 15px - var(--start-x)) * 0.08), calc(var(--target-y) * 0.10), 40px) rotateY(108deg) scale(0.85);
          opacity: 0.95;
        }
        35% {
          transform: translate3d(calc((50vw - 15px - var(--start-x)) * 0.28), calc(var(--target-y) * 0.32), 50px) rotateY(252deg) scale(1);
          opacity: 0.95;
        }
        55% {
          transform: translate3d(calc((50vw - 15px - var(--start-x)) * 0.55), calc(var(--target-y) * 0.58), 30px) rotateY(396deg) scale(1);
          opacity: 0.9;
        }
        75% {
          transform: translate3d(calc((50vw - 15px - var(--start-x)) * 0.80), calc(var(--target-y) * 0.82), 12px) rotateY(540deg) scale(0.75);
          opacity: 0.65;
        }
        90% {
          transform: translate3d(calc((50vw - 15px - var(--start-x)) * 0.95), calc(var(--target-y) * 0.96), 4px) rotateY(648deg) scale(0.4);
          opacity: 0.3;
        }
        100% {
          transform: translate3d(calc(50vw - 15px - var(--start-x)), calc(var(--target-y) + 17px), 0) rotateY(720deg) scale(0.15);
          opacity: 0;
        }
      }

      /* === Banknote rain (skin: banknote) === */
      .coin-layer[data-skin="banknote"] .coin { display: none; }
      .coin-layer[data-skin="banknote"] .note { display: block; }
      .note {
        position: absolute;
        top: -40px;
        left: var(--start-x);
        display: none;
        animation: note-flow var(--duration) linear var(--delay) infinite;
        will-change: transform, opacity;
        transform-style: preserve-3d;
      }
      .note svg { display: block; }
      @keyframes note-flow {
        0% {
          transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg) scale(0.5);
          opacity: 0;
        }
        5% {
          opacity: 0.9;
        }
        15% {
          transform: translate3d(calc((50vw - 30px - var(--start-x)) * 0.08), calc(var(--target-y) * 0.10), 40px) rotateY(72deg) rotateZ(-4deg) scale(0.85);
          opacity: 0.95;
        }
        35% {
          transform: translate3d(calc((50vw - 30px - var(--start-x)) * 0.28), calc(var(--target-y) * 0.32), 50px) rotateY(144deg) rotateZ(5deg) scale(1);
          opacity: 0.95;
        }
        55% {
          transform: translate3d(calc((50vw - 30px - var(--start-x)) * 0.55), calc(var(--target-y) * 0.58), 30px) rotateY(216deg) rotateZ(-3deg) scale(1);
          opacity: 0.9;
        }
        75% {
          transform: translate3d(calc((50vw - 30px - var(--start-x)) * 0.80), calc(var(--target-y) * 0.82), 12px) rotateY(288deg) rotateZ(4deg) scale(0.75);
          opacity: 0.65;
        }
        90% {
          transform: translate3d(calc((50vw - 30px - var(--start-x)) * 0.95), calc(var(--target-y) * 0.96), 4px) rotateY(342deg) rotateZ(-2deg) scale(0.4);
          opacity: 0.3;
        }
        100% {
          transform: translate3d(calc(50vw - 30px - var(--start-x)), calc(var(--target-y) + 23px), 0) rotateY(360deg) rotateZ(0deg) scale(0.15);
          opacity: 0;
        }
      }

      /* === End button === */
      .end-wrap {
        position: relative; z-index: 20;
        display: flex; justify-content: center;
        padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 32px);
      }
      .end-btn {
        font-size: 15px; font-weight: 500;
        color: var(--brand-dark-ink-2);
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--brand-dark-border);
        border-radius: var(--brand-radius-pill);
        padding: 12px 32px;
        cursor: pointer;
        transition: background .2s ease, color .2s ease, transform .15s ease;
      }
      .end-btn:hover { background: rgba(255,255,255,0.12); color: var(--brand-dark-ink); }
      .end-btn:active { transform: scale(0.97); }

      /* === Reduced motion === */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .coin { display: none; }
        .note { display: none; }
      }
    </style>

    <script>
      (function () {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var timeEl = document.getElementById('focus-time');
        var earnEl = document.getElementById('focus-earnings');

        function fmtTime(s) {
          var m = Math.floor(s / 60), sec = s % 60;
          return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
        }
        function fmt(n) { return n.toFixed(2); }

        var elapsed = 12 * 60 + 30; // 12:30
        if (timeEl) timeEl.textContent = fmtTime(elapsed);

        if (reduce) {
          if (earnEl) earnEl.textContent = '¥' + fmt(3.00);
          return;
        }

        // Timer: +1s
        setInterval(function () {
          elapsed += 1;
          if (timeEl) timeEl.textContent = fmtTime(elapsed);
        }, 1000);

        // Earnings: count up to ¥3.00 over ~5s, then slow ongoing
        var earnings = 0;
        function bump() {
          if (!earnEl) return;
          earnEl.classList.remove('earnings-bump');
          void earnEl.offsetWidth;
          earnEl.classList.add('earnings-bump');
        }
        function setEarn(v) {
          earnings = v;
          earnEl.textContent = '¥' + fmt(v);
          bump();
        }

        var step = 0.20, target = 3.00;
        var fast = setInterval(function () {
          var next = Math.min(earnings + step, target);
          setEarn(next);
          if (next >= target) {
            clearInterval(fast);
            setInterval(function () { setEarn(earnings + 0.01); }, 4000);
          }
        }, 333);
      })();
    </script>

    <script>
      (function () {
        var skinBtn = document.getElementById('skin-toggle');
        var layer = document.getElementById('coin-layer');
        var coinMini = document.querySelector('.skin-coin-icon');
        var noteMini = document.querySelector('.skin-note-icon');
        var currentSkin = 'coin';

        function setSkin(skin) {
          currentSkin = skin;
          layer.setAttribute('data-skin', skin);
          if (skin === 'banknote') {
            coinMini.style.display = 'none';
            noteMini.style.display = 'inline-block';
            skinBtn.style.color = 'rgba(91,166,112,0.70)';
          } else {
            coinMini.style.display = 'inline-block';
            noteMini.style.display = 'none';
            skinBtn.style.color = 'rgba(240,199,94,0.70)';
          }
        }

        skinBtn.style.color = 'rgba(240,199,94,0.70)';

        skinBtn.addEventListener('click', function () {
          setSkin(currentSkin === 'coin' ? 'banknote' : 'coin');
        });
      })();
    </script>
